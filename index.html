<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debodebe - Apunte Compartido</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #1E1C1A;
            background: radial-gradient(circle at top center, #3E2723 0%, #1E1C1A 70%);
            color: #FFF8E7;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
        }
        .container {
            width: 100%;
            max-width: 420px;
            background: rgba(44, 38, 35, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(230, 213, 184, 0.15);
            border-radius: 28px;
            padding: 36px 28px;
            box-shadow: 0 24px 48px rgba(0, 0, 0, 0.6);
            text-align: center;
        }
        .logo-img {
            width: 84px;
            height: 84px;
            border-radius: 22px;
            object-fit: cover;
            margin: 0 auto 18px auto;
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.4);
            border: 2px solid rgba(255, 202, 40, 0.3);
        }
        h1 {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 4px;
            color: #FFF8E7;
        }
        .subtitle {
            font-size: 14px;
            color: #E6D5B8;
            opacity: 0.8;
            margin-bottom: 28px;
        }
        .debt-card {
            background: rgba(30, 28, 26, 0.8);
            border: 1px solid rgba(230, 213, 184, 0.12);
            border-radius: 20px;
            padding: 22px;
            margin-bottom: 28px;
            text-align: left;
        }
        .debt-concept {
            font-size: 17px;
            font-weight: 700;
            color: #FFF8E7;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .debt-amount {
            font-size: 34px;
            font-weight: 800;
            color: #66BB6A;
            letter-spacing: -0.5px;
        }
        .debt-type {
            font-size: 13px;
            font-weight: 600;
            color: #E6D5B8;
            margin-top: 6px;
            opacity: 0.9;
        }
        .sender-badge {
            margin-top: 10px;
            font-size: 12px;
            color: #BCAAA4;
            display: inline-block;
        }
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 16px 24px;
            background: linear-gradient(135deg, #FFCA28 0%, #FFA000 100%);
            color: #1E1C1A;
            font-size: 16px;
            font-weight: 700;
            border-radius: 18px;
            text-decoration: none;
            transition: all 0.2s ease;
            box-shadow: 0 10px 24px rgba(255, 202, 40, 0.25);
            border: none;
            cursor: pointer;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 28px rgba(255, 202, 40, 0.35);
        }
        .footer {
            margin-top: 22px;
            font-size: 12px;
            color: #BCAAA4;
            opacity: 0.7;
        }
    </style>
</head>
<body>

<div class="container">
    <img src="logo.png" alt="Debodebe Logo" class="logo-img">
    <h1>Debodebe</h1>
    <p class="subtitle">Cuentas claras y gestión de deudas</p>

    <div class="debt-card" id="debtCard">
        <div class="debt-concept" id="debtConcept">📌 Apunte cargado</div>
        <div class="debt-amount" id="debtAmount">-- €</div>
        <div class="debt-type" id="debtType">Apunte compartido para importar</div>
        <div class="sender-badge" id="senderBadge"></div>
    </div>

    <a href="#" id="openAppBtn" class="btn">
        <span>📱</span> Abrir en Debodebe
    </a>

    <p class="footer">Debodebe App • Android</p>
</div>

<script>
    (function() {
        const urlParams = new URLSearchParams(window.location.search);
        const data = urlParams.get('data');

        if (data) {
            try {
                // Decodificar Base64 seguro para URL
                const jsonStr = decodeURIComponent(escape(atob(data.replace(/-/g, '+').replace(/_/g, '/'))));
                const debt = JSON.parse(jsonStr);

                if (debt.concept) {
                    document.getElementById('debtConcept').textContent = (debt.emoji || '📌') + ' ' + debt.concept;
                }
                if (debt.amount) {
                    document.getElementById('debtAmount').textContent = parseFloat(debt.amount).toFixed(2) + ' €';
                }
                if (debt.type) {
                    const isOwed = debt.type === 'OWES_ME';
                    const amountEl = document.getElementById('debtAmount');
                    amountEl.style.color = isOwed ? '#EF5350' : '#66BB6A';
                    document.getElementById('debtType').textContent = isOwed 
                        ? 'Debes esta cantidad (se importará como debo)' 
                        : 'Te deben esta cantidad (se importará como me deben)';
                }
                if (debt.senderName) {
                    document.getElementById('senderBadge').textContent = 'Compartido por ' + debt.senderName;
                }
            } catch (e) {
                console.error("Error al decodificar la deuda:", e);
            }
        }

        // Configurar el botón para abrir el esquema personalizado debodebe://import como fallback nativo
        const openBtn = document.getElementById('openAppBtn');
        if (data) {
            openBtn.href = "debodebe://import?data=" + encodeURIComponent(data);
        } else {
            openBtn.href = "https://play.google.com/store/apps/details?id=com.mafdes.debodebe";
        }
    })();
</script>

</body>
</html>
